# Only scripts/verify_docker.py should normally create this disposable, isolated project.
# No .env, host ports, Docker socket, external volumes or real provider credentials.
x-test-backend: &test-backend
  image: ${CF_VALIDATION_RUNTIME_IMAGE:?use scripts/verify_docker.py}
  build: {context: ., dockerfile: deploy/Dockerfile, target: runtime}
  environment:
    CAREERFORGE_MODE: production
    CAREERFORGE_DATABASE_HOST: postgres
    CAREERFORGE_DATABASE_NAME: ${CF_VALIDATION_DB:?use scripts/verify_docker.py}
    CAREERFORGE_DATABASE_USER: careerforge
    CAREERFORGE_DATABASE_PASSWORD: validation-only-not-a-secret
    CAREERFORGE_REDIS_BROKER_URL: redis://broker:6379/0
    CAREERFORGE_REDIS_CACHE_URL: redis://cache:6379/0
    CAREERFORGE_STATE_DIR: /data
    CAREERFORGE_API_URL: http://api:8000
    PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  volumes: [teststate:/data]
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:rw,size=64m,mode=1777']
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${CF_VALIDATION_DB:?use scripts/verify_docker.py}
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: validation-only-not-a-secret
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U careerforge -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 60
  broker:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory-policy, noeviction]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  cache:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  validation:
    <<: *test-backend
    image: ${CF_VALIDATION_BACKEND_IMAGE:?use scripts/verify_docker.py}
    build: {context: ., dockerfile: deploy/Dockerfile, target: validation}
    profiles: [validation]
  api:
    <<: *test-backend
    command: [careerforge, serve, --host, 0.0.0.0]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
  worker:
    <<: *test-backend
    command: [celery, -A, 'careerforge.worker:celery_app', worker, -Q, careerforge, --concurrency=2, --loglevel=WARNING]
  dispatcher:
    <<: *test-backend
    command: [careerforge, dispatch]
volumes:
  teststate:
