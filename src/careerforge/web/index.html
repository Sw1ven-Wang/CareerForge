<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6fb">
  <title>DevTutor · 项目学习工作台</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#chat"><img src="/assets/mark.svg" alt=""><span>DevTutor<small>从岗位到能力</small></span></a>
      <button class="new-chat" id="new-chat"><span>＋</span> 开启新的学习对话 <kbd>N</kbd></button>
      <div class="nav-label">学习空间</div>
      <nav id="navigation" aria-label="主导航">
        <button data-view="chat" class="nav-item active"><span data-icon="chat"></span>学习对话<span class="nav-dot"></span></button>
        <button data-view="knowledge" class="nav-item"><span data-icon="book"></span>项目知识库<span class="nav-count" id="knowledge-count">—</span></button>
        <button data-view="plans" class="nav-item"><span data-icon="route"></span>我的学习计划</button>
        <button data-view="goals" class="nav-item"><span data-icon="target"></span>岗位与目标</button>
        <button data-view="tasks" class="nav-item"><span data-icon="activity"></span>任务进度</button>
      </nav>
      <div class="history-heading"><span class="nav-label">最近的学习</span><button id="refresh-history" class="icon-button" title="刷新学习记录" aria-label="刷新学习记录"><span data-icon="refresh"></span></button></div>
      <div id="history" class="history"><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="sidebar-bottom">
        <div class="evidence-note"><span data-icon="shield"></span><div>每一步，都有依据<small>基于已审核知识与固定源码</small></div></div>
        <button class="profile" id="profile"><span class="avatar">学</span><span>我的学习空间<small id="connection-label">正在连接本地服务</small></span><span class="status-dot" id="connection-dot"></span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="展开导航"><span data-icon="menu"></span></button><span>我的工作台</span><span class="slash">/</span><strong id="page-name">学习对话</strong></div>
        <div class="topbar-right"><span class="model-tag"><i></i><span id="model-name">连接中</span></span><button class="icon-button" id="refresh-page" title="刷新数据" aria-label="刷新数据"><span data-icon="refresh"></span></button></div>
      </header>
      <div id="global-error" class="global-error" role="alert" hidden></div>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="detail-dialog" class="detail-dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
