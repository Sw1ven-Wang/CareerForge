[project]
name = "careerforge"
version = "0.1.0"
description = "Evidence-based Agent development learning workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "celery>=5.4,<6",
  "argon2-cffi>=23,<26",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/careerforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["infrastructure: requires real PostgreSQL and Redis"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["careerforge"]
